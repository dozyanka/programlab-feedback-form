services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@formlab.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-FormLab Feedback}
      APP_KEY: ${APP_KEY:-local-development-change-this-value}
    volumes:
      - rate_data:/var/www/html/storage
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  rate_data:
